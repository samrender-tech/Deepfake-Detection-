# FF++ + DFDC, for the full system.
# The mixed manifest is half silent, so audio_stratified sampling is required:
# with random batching the audio and sync branches would get no gradient in
# many steps and the fusion head would learn to ignore them.
manifest: data/manifests/combined.parquet
cache_root: processed
n_frames: 32
image_size: 299
batch_size: 12
num_workers: 4
sampler: audio_stratified
use_audio: true
use_sync: true
audio_seconds: 4.0
max_sync_windows: 6
