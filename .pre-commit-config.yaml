# Mirrors CI so a failure is caught before the push, not after.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=2048]   # checkpoints and data belong in DVC, not git
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: scope-audit
        name: scope audit (detector, not generator)
        entry: python scripts/scope_audit.py
        language: system
        pass_filenames: false
        always_run: true
