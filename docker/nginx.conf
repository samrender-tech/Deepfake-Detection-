server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The SPA owns its routing; anything not a real file falls through to it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames are immutable, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /v1/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Uploads are up to 100 MB and analyses take ~10s; the defaults are
        # far too tight for both.
        client_max_body_size 128m;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    # SSE needs buffering off, or progress events arrive all at once at the end.
    location ~ ^/v1/analyses/[^/]+/events$ {
        proxy_pass http://api:8000;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }
}
